# /etc/nginx/sites-available/rtc.ktranowl.id.vn

# WebSocket upgrade helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream rtc_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    server_name rtc.ktranowl.id.vn;

    root /var/www/rtc;
    index index.html;

    # Main routing (React SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket signaling to Node backend
    location /ws {
        proxy_pass http://rtc_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Optional: proxy API routes if you add REST endpoints
    location /api/ {
        proxy_pass http://rtc_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Enable gzip
    gzip on;
    gzip_types text/css application/javascript application/json;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rtc.ktranowl.id.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rtc.ktranowl.id.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = rtc.ktranowl.id.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name rtc.ktranowl.id.vn;
    return 404; # managed by Certbot
}