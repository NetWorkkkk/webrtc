<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { 
            background: #f1f5f9; 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
        }
        .container {
            background: white; width: 100%; max-width: 420px;
            border-radius: 1.25rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .tabs { display: flex; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .tab {
            flex: 1; padding: 1rem; text-align: center; cursor: pointer;
            font-weight: 600; color: #64748b; transition: 0.3s;
        }
        .tab.active {
            color: var(--primary); border-bottom: 3px solid var(--primary); background: white;
        }

        .form-content { padding: 2rem; }
        .input-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; color: #1e293b; font-weight: 500; font-size: 0.9rem; }
        input {
            width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #e2e8f0;
            border-radius: 0.6rem; outline: none; font-size: 1rem; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .btn {
            width: 100%; padding: 0.8rem; border: none; border-radius: 0.6rem;
            font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.3s;
            margin-top: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .hidden { display: none; }
        .header { text-align: center; padding: 2rem 2rem 1rem; }
        .header h1 { font-size: 1.5rem; color: #0f172a; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Video Connect</h1>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('join')">Join a Room</div>
        <div class="tab" onclick="switchTab('create')">Create Room</div>
    </div>

    <div class="form-content">
        <form id="joinForm" action="#" method="POST">
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="joinName" placeholder="Enter your display name" required>
            </div>
            <div class="input-group">
                <label>Room ID</label>
                <input type="text" id="joinRoom" placeholder="Enter the room ID" required>
            </div>
            <button type="submit" class="btn btn-primary">Join Room</button>
        </form>

        <form id="createForm" class="hidden" action="#" method="POST">
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="createName" placeholder="Enter your display name" required>
            </div>
            <div class="input-group">
                <label>Room ID</label>
                <input type="text" id="createRoom" placeholder="Enter the room ID" required>
            </div>
            <button type="submit" class="btn btn-primary">Create Room</button>
        </form>
    </div>
</div>

<script>
    function switchTab(type) {
        const tabs = document.querySelectorAll('.tab');
        const joinForm = document.getElementById('joinForm');
        const createForm = document.getElementById('createForm');

        if (type === 'join') {
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
            joinForm.classList.remove('hidden');
            createForm.classList.add('hidden');
        } else {
            tabs[1].classList.add('active');
            tabs[0].classList.remove('active');
            createForm.classList.remove('hidden');
            joinForm.classList.add('hidden');
            
            document.getElementById('createRoom').value = Math.random().toString(36).substring(2, 10).toUpperCase();
        }
    }

    document.getElementById('joinForm').onsubmit = (e) => {
        e.preventDefault();
    };

    document.getElementById('createForm').onsubmit = (e) => {
        e.preventDefault();
    };
</script>

</body>
</html>
