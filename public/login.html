<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Connect - Join or Create</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error: #ef4444;
            --success: #10b981;
            --bg: #f1f5f9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { 
            background: linear-gradient(135deg, #a5a5a5 0%, #444444 100%); 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
        }
        .container {
            background: white; width: 100%; max-width: 420px;
            border-radius: 1.25rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .tabs { display: flex; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .tab {
            flex: 1; padding: 1rem; text-align: center; cursor: pointer;
            font-weight: 600; color: #64748b; transition: 0.3s;
        }
        .tab.active {
            color: var(--primary); border-bottom: 3px solid var(--primary); background: white;
        }

        .form-content { padding: 2rem; }
        .input-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; color: #1e293b; font-weight: 500; font-size: 0.9rem; }
        input {
            width: 100%; padding: 0.75rem 1rem; border: 1.5px solid #e2e8f0;
            border-radius: 0.6rem; outline: none; font-size: 1rem; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .message {
            padding: 0.75rem; border-radius: 0.5rem; font-size: 0.85rem; margin-bottom: 1rem; display: none;
            line-height: 1.4;
        }
        .message.error { display: block; background: #fee2e2; color: var(--error); border: 1px solid #fecaca; }
        .message.success { display: block; background: #d1fae5; color: var(--success); border: 1px solid #a7f3d0; }

        .btn {
            width: 100%; padding: 0.8rem; border: none; border-radius: 0.6rem;
            font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.3s;
            margin-top: 0.5rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        
        .hidden { display: none; }
        .header { text-align: center; padding: 2rem 2rem 1rem; }
        .header h1 { font-size: 1.5rem; color: #0f172a; }
    </style>
    <base href="http://localhost:3000/" />
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Video Connect</h1>
    </div>

    <div class="tabs">
        <div id="tabJoin" class="tab active" onclick="switchTab('join')">Join Room</div>
        <div id="tabCreate" class="tab" onclick="switchTab('create')">Create Room</div>
    </div>

    <div class="form-content">
        <div id="responseMsg" class="message"></div>

        <form id="joinForm">
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="joinName" placeholder="Enter your display name" required>
            </div>
            <div class="input-group">
                <label>Room ID</label>
                <input type="text" id="joinRoom" placeholder="Enter the room ID" required>
            </div>
            <button type="submit" class="btn btn-primary">Join Room</button>
        </form>

        <form id="createForm" class="hidden">
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="createName" placeholder="Enter your display name" required>
            </div>
            <div class="input-group">
                <label>Custom Room ID</label>
                <input type="text" id="createRoom" placeholder="Enter your custom room ID" required>
            </div>
            <button type="submit" class="btn btn-primary">Create Room</button>
        </form>
    </div>
</div>

<script>
    const DOMAiN = "localhost:3000";
    const ws = new WebSocket(`ws://${window.location.host}/ws`);
    const msgBox = document.getElementById('responseMsg');

    function showMsg(text, type) {
        msgBox.textContent = text;
        msgBox.className = `message ${type}`;
        msgBox.style.display = 'block';
    }

    function switchTab(type) {
        const tabJoin = document.getElementById('tabJoin');
        const tabCreate = document.getElementById('tabCreate');
        const joinForm = document.getElementById('joinForm');
        const createForm = document.getElementById('createForm');
        
        msgBox.style.display = 'none';

        if (type === 'join') {
            tabJoin.classList.add('active');
            tabCreate.classList.remove('active');
            joinForm.classList.remove('hidden');
            createForm.classList.add('hidden');
        } else {
            tabCreate.classList.add('active');
            tabJoin.classList.remove('active');
            createForm.classList.remove('hidden');
            joinForm.classList.add('hidden');
            document.getElementById('createRoom').value = Math.random().toString(36).substring(2, 8).toUpperCase();
        }
    }

    ws.onmessage = (event) => {
        console.log('Test: ', event.data);
        const data = JSON.parse(event.data);
        console.log('Reiceived: ', data);

        switch(data.type) {
            case 'roomMembers':
                showMsg("Success! Redirecting...", "success");
                sessionStorage.setItem('username', currentUsername);
                sessionStorage.setItem('roomId', data.roomId);
                sessionStorage.setItem('members', data.members);
                setTimeout(() => {
                    window.location.href = `/room.html`;
                }, 1000);
                break;
            
            case 'error':
                showMsg(data.message, "error");
                break;
        }
    };

    let currentUsername = "";

    document.getElementById('joinForm').onsubmit = (e) => {
        e.preventDefault();
        currentUsername = document.getElementById('joinName').value.trim();
        const roomId = document.getElementById('joinRoom').value.trim().toUpperCase();

        socket.send(JSON.stringify({
            type: 'joinRoom',
            payload: { username: currentUsername, roomId }
        }));
    };

    document.getElementById('createForm').onsubmit = (e) => {
        e.preventDefault();
        currentUsername = document.getElementById('createName').value.trim();
        const roomId = document.getElementById('createRoom').value.trim().toUpperCase();

        socket.send(JSON.stringify({
            type: 'createRoom',
            payload: { username: currentUsername, roomId }
        }));
    };

</script>

</body>
</html>
