<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Connect - Join or Create</title>
    <script>
        (function() {
            const savedRoomId = sessionStorage.getItem('roomId');
            const savedUsername = sessionStorage.getItem('username');

            if (savedRoomId && savedUsername) {
                console.log("Redirecting to saved room:", savedRoomId);
                window.location.href = `/public/room.html`;
            }
        })();
    </script>
    <link rel="stylesheet" href="css/login.css">
    <!-- <base href="http://localhost:3000/" /> -->

</head>

<body>

<div class="container">
    <div class="header">
        <h1>Video Connect</h1>
    </div>

    <div class="tabs">
        <div id="tabJoin" class="tab active" onclick="switchTab('join')">Join Room</div>
        <div id="tabCreate" class="tab" onclick="switchTab('create')">Create Room</div>
    </div>

    <div class="form-content">
        <div id="responseMsg" class="message"></div>

        <form id="joinForm">
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="joinName" placeholder="Enter your display name" required>
            </div>
            <div class="input-group">
                <label>Room ID</label>
                <input type="text" id="joinRoom" placeholder="Enter the room ID" required>
            </div>
            <button type="submit" class="btn btn-primary">Join Room</button>
        </form>

        <form id="createForm" class="hidden">
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="createName" placeholder="Enter your display name" required>
            </div>
            <div class="input-group">
                <label>Custom Room ID</label>
                <input type="text" id="createRoom" placeholder="Enter your custom room ID" required>
            </div>
            <button type="submit" class="btn btn-primary">Create Room</button>
        </form>
    </div>
</div>

<script>
    const DOMAIN = "localhost:3000";
    const ws = new WebSocket(`ws://${DOMAIN}/ws`);
    const msgBox = document.getElementById('responseMsg');

    function showMsg(text, type) {
        msgBox.textContent = text;
        msgBox.className = `message ${type}`;
        msgBox.style.display = 'block';
    }

    function switchTab(type) {
        const tabJoin = document.getElementById('tabJoin');
        const tabCreate = document.getElementById('tabCreate');
        const joinForm = document.getElementById('joinForm');
        const createForm = document.getElementById('createForm');
        
        msgBox.style.display = 'none';

        if (type === 'join') {
            tabJoin.classList.add('active');
            tabCreate.classList.remove('active');
            joinForm.classList.remove('hidden');
            createForm.classList.add('hidden');
        } else {
            tabCreate.classList.add('active');
            tabJoin.classList.remove('active');
            createForm.classList.remove('hidden');
            joinForm.classList.add('hidden');
            document.getElementById('createRoom').value = Math.random().toString(36).substring(2, 8).toUpperCase();
        }
    }

    ws.onmessage = (event) => {
        console.log('Test: ', event.data);
        const data = JSON.parse(event.data);
        console.log('Reiceived: ', data);

        switch(data.type) {
            case 'roomMembers':
                showMsg("Success! Redirecting...", "success");
                sessionStorage.setItem('username', currentUsername);
                sessionStorage.setItem('roomId', data.roomId);
                sessionStorage.setItem('roomMembers', JSON.stringify(data.members));

                setTimeout(() => {
                    window.location.href = `public/room.html`;
                }, 1000);
                break;
            
            case 'error':
                showMsg(data.message, "error");
                break;
        }
    };

    let currentUsername = "";

    document.getElementById('joinForm').onsubmit = (e) => {
        e.preventDefault();
        currentUsername = document.getElementById('joinName').value.trim();
        const roomId = document.getElementById('joinRoom').value.trim().toUpperCase();

        ws.send(JSON.stringify({
            type: 'joinRoom',
            username: currentUsername,
            roomId: roomId
        }));
    };

    document.getElementById('createForm').onsubmit = (e) => {
        e.preventDefault();
        currentUsername = document.getElementById('createName').value.trim();
        const roomId = document.getElementById('createRoom').value.trim().toUpperCase();

        ws.send(JSON.stringify({
            type: 'createRoom',
            username: currentUsername,
            roomId: roomId
        }));
    };

</script>

</body>
</html>
