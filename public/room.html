<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sảnh chờ - Video Connect</title>
    <link rel="stylesheet" href="css/room.css">
</head>
<body>

<div class="room-card">
    <div class="header">
        <h1>Phòng: <span id="displayRoomId">...</span></h1>
        <p>Chào, <span id="helloName">...</span></p>
    </div>

    <div class="member-list" id="memberList">
    </div>

    <div class="actions">
        <button id="btnCallAction" class="btn" onclick="goToCall()">Start Group Call</button>
        <button id="btnLeave" class="btn" onclick="leaveRoom()">Leave Room</button>
    </div>
</div>

<script>
    const username = sessionStorage.getItem('username');
    const roomId = sessionStorage.getItem('roomId');
    const roomMembers = JSON.parse(sessionStorage.getItem('roomMembers') || "[]");
    const callMembers = JSON.parse(sessionStorage.getItem('callMembers') || "[]");

    document.getElementById('helloName').innerText = username;
    document.getElementById('displayRoomId').innerText = roomId;

    const socket = new WebSocket(`ws://${window.location.host}/ws`);

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'roomMembers') {
            renderMembers(data.members);
        }
    };

    function renderMembers(members) {
        const list = document.getElementById('memberList');
        list.innerHTML = '<strong>Thành viên online:</strong>';
        
        // Giả sử server trả về danh sách kèm trạng thái call

        members.forEach(m => {
            const isInCall = callMembers.includes(m);
            const item = document.createElement('div');
            item.className = 'member-item';
            item.innerHTML = `<span class="status-dot ${isInCall ? 'incall' : ''}"></span> ${m} ${m === username ? '(Bạn)' : ''}`;
            list.appendChild(item);
        });

        // Cập nhật nút dựa trên trạng thái chung
        const btn = document.getElementById('btnCallAction');
        if (callMembers.length > 0) {
            btn.innerText = "Join Group Call";
            btn.style.background = "var(--success)";
        }
    }

    function goToCall() {
        // Chuyển hướng sang trang call
        window.location.href = `/call/${roomId}`;
    }

    function leaveRoom() {
        sessionStorage.clear();
        window.location.href = '/';
    }
</script>
</body>
</html>
