# TURN config for LAN-only deployment
# Replace values marked with <> before use.

listening-port=3478

# LAN case: non-TLS TURN is usually enough for testing/internal use.
# For trusted HTTPS LAN setup, you can add tls-listening-port/cert/pkey.

realm=<LAN_IP>
server-name=<LAN_IP>

lt-cred-mech
user=testuser:testpassword

fingerprint
no-multicast-peers

# Bind to the server LAN address (example: 192.168.1.10)
listening-ip=<LAN_IP>
relay-ip=<LAN_IP>

# In pure LAN deployment, external-ip is typically unnecessary.
# If your LAN has extra NAT hops, set accordingly:
# external-ip=<PUBLIC_OR_UPSTREAM_IP>/<LAN_IP>

min-port=49152
max-port=65535

verbose
