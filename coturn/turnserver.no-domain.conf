# TURN config for VPS with public IP and NO domain (HTTP/non-TLS scenario)
# Replace values marked with <> before use.

listening-port=3478

# No domain: prefer non-TLS TURN on 3478
# (turns:5349 is usually skipped unless you provide valid certs)

realm=<PUBLIC_IP>
server-name=<PUBLIC_IP>

lt-cred-mech
user=testuser:testpassword

fingerprint
no-multicast-peers

# Network binding
# If your VPS only has public IP, set both to that IP.
# If your VPS has private NIC + public NAT, set:
#   listening-ip=<PRIVATE_IP>
#   relay-ip=<PRIVATE_IP>
#   external-ip=<PUBLIC_IP>/<PRIVATE_IP>
listening-ip=<PUBLIC_OR_PRIVATE_IP>
relay-ip=<PUBLIC_OR_PRIVATE_IP>
external-ip=<PUBLIC_IP>/<PRIVATE_IP>

min-port=49152
max-port=65535

verbose
